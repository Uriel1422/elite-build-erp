version: '3.8'

services:
  api-gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - project-service

  auth-service:
    build: ./backend/services/auth-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_URI=postgres://postgres:postgres@postgres:5432/elite_db
      - REDIS_URI=redis://redis:6379
      - JWT_SECRET=elite_build_jwt_secret_key_2026_xyz
    depends_on:
      - postgres
      - redis

  project-service:
    build: ./backend/services/project-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - DB_URI=postgres://postgres:postgres@postgres:5432/elite_db
      - MONGO_URI=mongodb://mongo:27017/elite_docs
    depends_on:
      - postgres
      - mongo

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=elite_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:6-jammy
    ports:
      - "2717:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  mongo_data:
  redis_data:
